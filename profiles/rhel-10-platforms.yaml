    paths:
      - 'arch/arm64/boot/dts/rockchip/rk3576-evb1*'
      - 'arch/arm64/boot/dts/rockchip/rk3588*-evb1*'
      - 'arch/arm64/boot/dts/rockchip/Makefile'

  # Plan 06 includes NanoPi R76S and M5.
  - name: FriendlyElec NanoPi and NanoPC Rockchip boards
